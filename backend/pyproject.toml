[project]
name = "onetrail-api"
version = "0.1.0"
description = "Onetrail backend API for hiking decision support"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "httpx2>=2.0,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "app",
  "core",
  "database",
  "identity",
  "route_content",
  "recommendation",
  "equipment",
  "hiking_history",
  "platform_services",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
